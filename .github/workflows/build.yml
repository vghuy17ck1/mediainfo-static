name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: MediaInfo version to build, for example v24.12 (empty for the latest stable release)
        required: false
        type: string
        default: ''
      release:
        description: Publish a GitHub release after all builds pass
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.version || 'latest' }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="$(bash util/resolve-version.sh "$VERSION")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Building MediaInfo $tag" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.target }}
    needs: resolve
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux64
            runner: ubuntu-24.04
          - target: linuxarm64
            runner: ubuntu-24.04-arm
          - target: win64
            runner: ubuntu-24.04
          - target: winarm64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: work/cache
          key: sources-${{ hashFiles('versions.env') }}-${{ needs.resolve.outputs.tag }}
          restore-keys: sources-${{ hashFiles('versions.env') }}-
      - name: Build
        run: ./run.sh ${{ matrix.target }} ${{ needs.resolve.outputs.tag }}
      - uses: actions/upload-artifact@v7
        with:
          name: mediainfo-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  test:
    name: Test ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win64
            runner: windows-2025
          - target: winarm64
            runner: windows-11-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: mediainfo-${{ matrix.target }}
          path: artifacts
      - name: Run smoke test
        run: |
          unzip -q artifacts/*.zip -d package
          bash tests/smoke-test.sh package/mediainfo.exe

  release:
    name: Publish release
    if: ${{ inputs.release }}
    needs: [resolve, build, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: mediainfo-*
          merge-multiple: true
          path: artifacts
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: bash util/publish-release.sh "$TAG" artifacts
